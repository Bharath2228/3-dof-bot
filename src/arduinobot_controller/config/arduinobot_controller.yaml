controller_manager:
  ros__parameters:
    update_rate: 10 #frequency of the control loop will be updated and executed

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
     # type: joint_trajectory_controller/JointTrajectoryController
      type: forward_command_controller/ForwardCommandController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

arm_controller:
  ros__parameters:
    joints:
      - joint_1
      - joint_2
      - joint_3

    command_interfaces:
     - position

    state_interfaces:
      - position
    
    open_loop_control: true
    allow_integration_in_goal_trajectories: true

gripper_controller:
  ros__parameters:
    joints:
      - joint_4 # we dont need joint 5 because it simply copies the behaviour of the j4

    interface_name: position
    
    # command_interfaces:
    #  - position

    # state_interfaces:
    #   - position
    
    # open_loop_control: true
    # allow_integrartion_in_goal_trajectories: true