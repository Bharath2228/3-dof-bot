[flake8]
# Starting point: ament's own default ignore list (see
# ament_flake8/configuration/ament_flake8.ini), plus a few codes that
# conflict with this project's chosen style rather than flagging real bugs:
#   I100, I101, I201 - import ordering/grouping (flake8-import-order).
#     This project groups imports by "what they're for" rather than
#     flake8-import-order's convention; not worth reshuffling every file.
#   CNL100           - flake8-class-newline. Cosmetic.
#   Q000             - quote style. The launch files use double quotes,
#     the node logic files use single quotes; there's no one convention
#     to enforce here, so don't fight either file's style.
# E302/E303/E501/W292/W293 and friends stay enabled - those are cheap,
# genuinely useful hygiene checks.
extend-ignore = B902,C816,D100,D101,D102,D103,D104,D105,D106,D107,D203,D212,D404,I100,I101,I201,I202,CNL100,Q000
import-order-style = google
max-line-length = 99
show-source = true
statistics = true
